<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player &amp; Admin Login | Shashikant Turf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Sticky Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">⚽</div>
        <div>
          Shashikant <span>Turf</span>
          <span class="turf-pill">MUMBAI</span>
        </div>
      </a>
      <div>
        <a href="register.html" class="btn btn-outline btn-sm">Create Account ➔</a>
      </div>
    </div>
  </nav>

  <main class="container" style="display:flex; align-items:center; justify-content:center; flex:1; padding:50px 20px;">
    <div style="background:#111a2e; border:1.5px solid rgba(255,255,255,0.12); border-radius:var(--radius-xl); padding:36px; max-width:440px; width:100%; box-shadow:var(--shadow-md);">
      
      <div style="text-align:center; margin-bottom:24px;">
        <span class="badge badge-success" style="margin-bottom:10px;">⚡ PLAYER &amp; ADMIN PORTAL</span>
        <h2 style="font-size:2rem; font-weight:800; color:#fff;">Welcome Back</h2>
        <p style="font-size:0.88rem; color:#94a3b8;">Log in to access your booked match passes and receipts</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)">
        <div style="margin-bottom:16px;">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="name@gmail.com" value="sharvaripore11@gmail.com" style="width:100%;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" value="Password123" style="width:100%;">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem; margin-bottom:16px;">
          Log In ➔
        </button>

        <div style="text-align:center; font-size:0.85rem; color:#94a3b8;">
          Don't have an account? <a href="register.html" style="color:var(--neon-green); font-weight:700;">Sign Up</a>
        </div>
      </form>

    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const user = {
        name: email.split('@')[0],
        email: email,
        role: email.includes('admin') ? 'admin' : 'user'
      };
      localStorage.setItem('current_user', JSON.stringify(user));
      showToast("Logged in successfully! Redirecting...", "✅");
      setTimeout(() => {
        window.location.href = (user.role === 'admin') ? 'Admin/dashboard.html' : 'index.html';
      }, 600);
    }
  </script>
</body>
</html>
