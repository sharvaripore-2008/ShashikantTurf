<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Turfs | TurfArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-card: #111827;
      --bg-surface: #182234;
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --accent: #00f076;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .navbar {
      background: rgba(10, 15, 29, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-container { display: flex; align-items: center; justify-content: space-between; }
    .brand-logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .brand-logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { color: var(--text-muted); font-weight: 500; font-size: 0.95rem; }
    .nav-link:hover, .nav-link.active { color: var(--text-main); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 20px; border-radius: var(--radius-md); font-family: 'Outfit', sans-serif;
      font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #059669); color: white; box-shadow: 0 4px 15px var(--primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); }
    .btn-outline { border-color: var(--border-color); background: transparent; color: var(--text-main); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 14px; font-size: 0.85rem; }

    .page-header { background: var(--bg-surface); padding: 40px 0; border-bottom: 1px solid var(--border-color); }
    .page-title { font-size: 2.2rem; margin-bottom: 6px; }

    .filter-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 20px; margin: 30px 0;
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    }
    .form-control {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 10px 16px; border-radius: var(--radius-md);
      outline: none; font-family: inherit; font-size: 0.95rem;
    }

    .turf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px; padding-bottom: 60px; }
    .turf-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); overflow: hidden; transition: 0.25s; display: flex; flex-direction: column;
    }
    .turf-card:hover { transform: translateY(-5px); border-color: rgba(16,185,129,0.5); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .turf-img-wrap { position: relative; height: 210px; }
    .turf-img { width: 100%; height: 100%; object-fit: cover; }
    .sport-tag { position: absolute; top: 12px; left: 12px; background: rgba(10,15,29,0.85); padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; color: var(--accent); font-weight: 700; }
    .rating-tag { position: absolute; top: 12px; right: 12px; background: rgba(10,15,29,0.85); padding: 4px 8px; border-radius: 999px; font-size: 0.8rem; color: #fbbf24; font-weight: 700; }
    .turf-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .turf-location { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .turf-name { font-size: 1.3rem; margin-bottom: 12px; }
    .turf-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 14px; margin-top: auto; }
    .turf-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); }

    .footer { margin-top: auto; background: #070b14; border-top: 1px solid var(--border-color); padding: 25px 0; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">⚽</div>
        Shashikant<span>Turf</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="turfs.html" class="nav-link active">Explore Turfs</a>
        <a href="my-bookings.html" class="nav-link">My Bookings</a>
      </div>
      <div>
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">Explore All Available Turfs</h1>
      <p style="color:var(--text-muted);">Compare venues, amenities, slot prices, and book in 2 clicks.</p>
    </div>
  </div>

  <main class="container">
    <div class="filter-card">
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; flex:1;">
        <input type="text" id="searchInput" class="form-control" style="flex:1; min-width:200px;" placeholder="🔍 Search turf name or area...">
        <select id="sportFilter" class="form-control">
          <option value="all">🏆 All Sports</option>
          <option value="football">⚽ Football</option>
          <option value="cricket">🏏 Box Cricket</option>
        </select>
      </div>
      <div id="countBadge" style="color:var(--primary); font-weight:700; font-size:0.9rem;">
        Showing 4 Turfs
      </div>
    </div>

    <div class="turf-grid" id="turfGrid"></div>
  </main>

  <footer class="footer">
    © 2026 TurfArena Booking System. All rights reserved.
  </footer>

  <script>
    const TURFS = [
      {
        id: "TRF-101",
        name: "KickOff Grand Arena",
        sport: "Football & Cricket",
        category: "football",
        location: "Andheri West, Mumbai • 7v7",
        price: 1200,
        rating: 4.9,
        image: "https://images.unsplash.com/photo-1529900241929-5ed53a0f33dd?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "TRF-102",
        name: "Skyline Rooftop Turf",
        sport: "Box Cricket & Football",
        category: "cricket",
        location: "Bandra West, Mumbai • 5v5",
        price: 1500,
        rating: 4.8,
        image: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "TRF-103",
        name: "Striker's Hub Multisport",
        sport: "Cricket & Football",
        category: "cricket",
        location: "Powai, Mumbai • 6v6",
        price: 1000,
        rating: 4.7,
        image: "https://images.unsplash.com/photo-1551958219-acbc608c6377?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "TRF-104",
        name: "Apex International Arena",
        sport: "FIFA Standard Football",
        category: "football",
        location: "Kandivali East, Mumbai • 8v8",
        price: 1800,
        rating: 4.9,
        image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80"
      }
    ];

    function renderTurfs(list) {
      const grid = document.getElementById('turfGrid');
      document.getElementById('countBadge').innerText = `Showing ${list.length} Turfs`;
      
      grid.innerHTML = list.map(t => `
        <div class="turf-card">
          <div class="turf-img-wrap">
            <img class="turf-img" src="${t.image}" alt="${t.name}">
            <span class="sport-tag">${t.sport}</span>
            <span class="rating-tag">★ ${t.rating}</span>
          </div>
          <div class="turf-body">
            <div class="turf-location">📍 ${t.location}</div>
            <h3 class="turf-name">${t.name}</h3>
            <div class="turf-footer">
              <div class="turf-price">₹${t.price} <small style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">/ hr</small></div>
              <a href="turf-details.html?id=${t.id}" class="btn btn-primary btn-sm">Book Slot ➔</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterTurfs() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const sport = document.getElementById('sportFilter').value;

      const filtered = TURFS.filter(t => {
        const matchesQ = t.name.toLowerCase().includes(q) || t.location.toLowerCase().includes(q);
        const matchesSport = sport === 'all' || t.category === sport;
        return matchesQ && matchesSport;
      });

      renderTurfs(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterTurfs);
    document.getElementById('sportFilter').addEventListener('change', filterTurfs);

    renderTurfs(TURFS);
  </script>
</body>
</html>
