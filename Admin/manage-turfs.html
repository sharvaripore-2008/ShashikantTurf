<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Turfs | Shashikant Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar" style="border-bottom: 1px solid var(--border-color);">
    <div class="container nav-container" style="max-width: 100%; padding: 0 30px;">
      <a href="../index.html" class="brand-logo">
        <div class="logo-icon">⚽</div>
        Shashikant<span>Turf</span> <span style="font-size:0.75rem; background:rgba(16,185,129,0.2); color:var(--accent); padding:2px 8px; border-radius:4px; margin-left:6px;">ADMIN</span>
      </a>
      <div style="display:flex; align-items:center; gap:16px;">
        <a href="../index.html" class="btn btn-outline btn-sm">🌐 Live Site</a>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-menu">
        <div class="sidebar-heading">Core Management</div>
        <a href="dashboard.html" class="sidebar-link">
          <span class="icon">📊</span> Overview & Stats
        </a>
        <a href="manage-turfs.html" class="sidebar-link active">
          <span class="icon">🏟️</span> Manage Turfs
        </a>
        <a href="calender.html" class="sidebar-link">
          <span class="icon">📅</span> Slot Calendar
        </a>
        <a href="../index.html" class="sidebar-link">
          <span class="icon">🏠</span> Back to Home
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Turf Venues Management</h1>
          <p>Add new turf arenas, update pricing per hour, or remove venues.</p>
        </div>
        <button onclick="openModal('addTurfModal')" class="btn btn-primary">
          + Add New Shashikant Turf
        </button>
      </div>

      <!-- Turfs Table -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Arena Name & Size</th>
                <th>Location</th>
                <th>Hourly Rate</th>
                <th>Rating</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminTurfsTable">
              <!-- Populated via js/admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <!-- Add Turf Modal -->
  <div class="modal-overlay" id="addTurfModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size: 1.3rem;">Add New Turf Venue</h3>
        <button type="button" class="close-btn" onclick="closeModal('addTurfModal')">&times;</button>
      </div>

      <form onsubmit="handleAddTurf(event)">
        <div class="form-group">
          <label>Arena Name *</label>
          <input type="text" id="newTurfName" class="form-control" placeholder="e.g. Apex Football Ground" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label>Sport Category *</label>
            <select id="newTurfSport" class="form-control">
              <option value="football">⚽ Football</option>
              <option value="cricket">🏏 Box Cricket</option>
            </select>
          </div>

          <div class="form-group">
            <label>Turf Size (e.g. 5v5, 7v7) *</label>
            <input type="text" id="newTurfSize" class="form-control" placeholder="7v7" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:16px;">
          <div class="form-group">
            <label>Location / City *</label>
            <input type="text" id="newTurfLocation" class="form-control" placeholder="e.g. Juhu, Mumbai" required>
          </div>

          <div class="form-group">
            <label>Rate (₹ / Hour) *</label>
            <input type="number" id="newTurfPrice" class="form-control" placeholder="1200" required>
          </div>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="url" id="newTurfImage" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="newTurfDesc" class="form-control" rows="3" placeholder="Brief description of the turf facilities..."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('addTurfModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save & Publish Turf</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
